<style>
/* Plzeň additions on top of the Brno page style (pipeline/brno/assets/style.css.html) and the Brno trolleybus sheet's
   extra.css.html (sticky bar, search, battery and pool chips, "not needed" rows). The accent is set per sheet by
   05_render.py from the state (PMDP trolleybus green, PMDP bus red). */
:root{ --kar:#0a7a3e; --kar-soft:#e0f1e6; --ext:#8a4f9e; --ext-soft:#efe2f4; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --kar:#5fcf8f; --kar-soft:#17301f; --ext:#c99ae0; --ext-soft:#33223b; } }
:root[data-theme="dark"]{ --kar:#5fcf8f; --kar-soft:#17301f; --ext:#c99ae0; --ext-soft:#33223b; }
.dot.kar{background:var(--kar)} .dot.ext{background:var(--ext)}
.chip.diesel{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--warn);color:#fff}
.chip.req{background:var(--warn-soft);color:var(--warn)}
.chip.des{background:var(--warn-soft);color:var(--warn)}
.chip.opx{background:var(--ext-soft);color:var(--ext)}
.batmark.no{color:var(--muted)}
.dieselmark{font:600 10.5px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-left:6px}
tr.designed td{background:var(--warn-soft)}
.stops{font-size:12.5px;color:var(--ink2)}
.stops .off{color:var(--bat);font-weight:600}
.checkok{color:var(--bat);font-weight:600}
.checkbad{color:var(--warn);font-weight:700}
.sched td.big.wrap{white-space:normal;max-width:170px;min-width:90px}
